name: Build LiPlay AppImage

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            librsvg2-bin \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            file \
            wget \
            fuse \
            libfuse2

      - name: Generate icon PNGs from SVG
        run: |
          cd src-tauri/icons
          rsvg-convert -w  32 -h  32  icon.svg -o 32x32.png
          rsvg-convert -w 128 -h 128  icon.svg -o 128x128.png
          rsvg-convert -w 256 -h 256  icon.svg -o 128x128@2x.png
          rsvg-convert -w 512 -h 512  icon.svg -o icon.png
          ls -la

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Build AppImage
        run: npm run tauri:build

      - name: Locate AppImage
        id: locate
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          echo "Found: $APPIMAGE"
          cp "$APPIMAGE" "LiPlay-${{ github.sha }}.AppImage"
          echo "path=LiPlay-${{ github.sha }}.AppImage" >> "$GITHUB_OUTPUT"

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiPlay-AppImage
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.path }}
          generate_release_notes: true
