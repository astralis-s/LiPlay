[package]
name = "liplay"
version = "0.1.0"
description = "LiPlay  minimalist offline music player"
authors = ["LiPlay"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "liplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-os = "2.0"

# --- Async runtime ---
tokio = { version = "1.41", features = ["full"] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Errors / logging ---
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Filesystem / paths ---
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"

# --- SQLite (bundled, no system dep) ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
# Force libsqlite3-sys to statically link the SQLite amalgamation so the
# AppImage has no runtime dependency on libsqlite3.so on the host system.
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# --- Audio metadata / ID3 / FLAC / Vorbis tags (single crate, in-place writes) ---
lofty = "0.21"

# --- Audio decoding & playback ---
# rodio bundles cpal output + symphonia decoders + the source-combinator graph
# we use for gapless, crossfade, EQ and normalization wrappers.
rodio = { version = "0.19", features = ["symphonia-all"] }

# --- HTTP (LRCLIB) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
url = "2.5"

# --- Misc ---
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
